# fwd state replication — local file replica.
#
# Litestream continuously replicates /data/state.db WAL segments into the
# shared `backup` Docker volume mounted at /backup. Off-host transport
# (rsync / restic / borg / NAS / USB — operator's choice) is run out-of-band
# against the same volume.
#
# Replication frequency: WAL segments sync continuously (~10s RPO).
# Snapshot interval: 24h (compact base for fast restore).
# Retention: 72h on snapshots (keeps 3 daily snapshots + their WAL chain).
#
# The cloud-S3 replica shipped at v0.4.1 was reverted at v0.4.3 per the
# operator's "no outside dependencies" directive. fwd produces backup
# artifacts at a known local path; transport off-host is the operator's job.

dbs:
  - path: /data/state.db
    replicas:
      - type: file
        path: /backup/state.db
        retention: 72h
        snapshot-interval: 24h
        sync-interval: 10s
