# `--with-clif` overlay — the keyless clif claim/FSP layer on top of fwd.
#
# Use WITH the base compose (one merged project, so the `fwd-callers` network
# and the `fwd` service name are shared):
#
#   docker compose -f docker-compose.yml -f docker-compose.clif.yml up -d            # fwd only
#   docker compose -f … --profile songbird up -d                                     # + songbird epoch daemon
#
# The host `fwd` wrapper (install/fwd) includes this file automatically when it is
# present. `up` / `fwd start` bring up fwd only; the clif daemon is PER-NETWORK:
# ONE epoch-anchored sign→claim daemon per network (`epoch run`),
# `profiles: ["<net>"]` (`fwd start <net>` / `--profile <net>`). It replaces the
# former per-network CLAIM + FSP pollers with a single daemon that sequences
# uptime(optional)→reward-sign→claim per reward epoch. The one-shot `clif`
# (profile `cli`) backs the `clif` host wrapper. Each network reads its own
# `.env.<net>`.
#
# Build-from-source: clif is a SEPARATE repo. The installer (build-from-source)
# places clif's pinned source at $CLIF_SRC (default ./clif, relative to this
# file) so `build:` has a context. clif holds ZERO private keys — it asks fwd to
# sign, then broadcasts itself (dual-homed: `fwd-callers` to reach fwd:8080,
# `egress` for its own RPC/broadcast). fwd is NOT on `egress` (zero-egress).
#
# Per-provider config lives in clif's gitignored .env.<net> (NETWORK, the fwd
# caller tokens, wallet names, recipient) — never committed. The daemon SIGNS, so
# it stays hard-off unless FSP_AUTO_ENABLED=true in that .env (clif enforces); the
# UPTIME phase is additionally gated by UPTIME_AUTO_ENABLED (default false).

services:
  clif:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    profiles: ["cli"]            # one-shot only; never started by `up`/`fwd start`
    entrypoint: ["clif"]
    env_file:
      - ${CLIF_ENV:-./clif/.env}
    networks: [fwd-callers, egress]
    # one-shot, e.g.:
    #   docker compose -f docker-compose.yml -f docker-compose.clif.yml \
    #     --profile cli run --rm clif chain nonce --network songbird --address 0x.. --json

  clif-epoch-coston2:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-epoch-coston2
    command: ["epoch", "run"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.coston2
    networks: [fwd-callers, egress]
    profiles: ["coston2"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "epoch", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-epoch-songbird:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-epoch-songbird
    command: ["epoch", "run"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.songbird
    networks: [fwd-callers, egress]
    profiles: ["songbird"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "epoch", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-epoch-flare:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-epoch-flare
    command: ["epoch", "run"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.flare
    networks: [fwd-callers, egress]
    profiles: ["flare"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "epoch", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

networks:
  # `fwd-callers` is defined by the base docker-compose.yml (internal: true) and
  # shared in the merged project — do NOT redeclare it here. `egress` is a normal
  # bridge giving clif (only) an internet route for RPC + broadcast.
  egress:
    driver: bridge
