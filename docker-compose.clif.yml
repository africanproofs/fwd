# `--with-clif` overlay — the keyless clif claim/FSP layer on top of fwd.
#
# Use WITH the base compose (one merged project, so the `fwd-callers` network
# and the `fwd` service name are shared):
#
#   docker compose -f docker-compose.yml -f docker-compose.clif.yml up -d            # fwd only
#   docker compose -f … --profile songbird up -d                                     # + songbird's clif daemons
#
# The host `fwd` wrapper (install/fwd) includes this file automatically when it is
# present. `up` / `fwd start` bring up fwd only; the clif claim/FSP daemons are
# PER-NETWORK (`profiles: ["<net>"]`) — start one network's daemons with
# `fwd start <net>` (or `--profile <net>`). The one-shot `clif` (profile `cli`)
# backs the `clif` host wrapper. There is no longer a single shared clif daemon;
# each network reads its own `.env.<net>`.
#
# Build-from-source: clif is a SEPARATE repo. The installer (build-from-source)
# places clif's pinned source at $CLIF_SRC (default ./clif, relative to this
# file) so `build:` has a context. clif holds ZERO private keys — it asks fwd to
# sign, then broadcasts itself (dual-homed: `fwd-callers` to reach fwd:8080,
# `egress` for its own RPC/broadcast). fwd is NOT on `egress` (zero-egress).
#
# Per-provider config lives in clif's gitignored .env (NETWORK, the fwd caller
# tokens, wallet names, recipient) — never committed. The FSP daemon stays
# hard-off unless FSP_AUTO_ENABLED=true in that .env (clif enforces).

services:
  clif:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    profiles: ["cli"]            # one-shot only; never started by `up`/`fwd start`
    entrypoint: ["clif"]
    env_file:
      - ${CLIF_ENV:-./clif/.env}
    networks: [fwd-callers, egress]
    # one-shot, e.g.:
    #   docker compose -f docker-compose.yml -f docker-compose.clif.yml \
    #     --profile cli run --rm clif chain nonce --network songbird --address 0x.. --json

  clif-auto-coston2:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-auto-coston2
    command: ["auto"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.coston2
    networks: [fwd-callers, egress]
    profiles: ["coston2"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-fsp-auto-coston2:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-fsp-auto-coston2
    command: ["fsp", "auto"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.coston2
    networks: [fwd-callers, egress]
    profiles: ["coston2"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "fsp", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-auto-songbird:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-auto-songbird
    command: ["auto"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.songbird
    networks: [fwd-callers, egress]
    profiles: ["songbird"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-fsp-auto-songbird:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-fsp-auto-songbird
    command: ["fsp", "auto"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.songbird
    networks: [fwd-callers, egress]
    profiles: ["songbird"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "fsp", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-auto-flare:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-auto-flare
    command: ["auto"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.flare
    networks: [fwd-callers, egress]
    profiles: ["flare"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-fsp-auto-flare:
    build:
      context: ${CLIF_SRC:-./clif}
    image: clif:dev
    container_name: clif-fsp-auto-flare
    command: ["fsp", "auto"]
    env_file:
      - ${CLIF_SRC:-./clif}/.env.flare
    networks: [fwd-callers, egress]
    profiles: ["flare"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "fsp", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

networks:
  # `fwd-callers` is defined by the base docker-compose.yml (internal: true) and
  # shared in the merged project — do NOT redeclare it here. `egress` is a normal
  # bridge giving clif (only) an internet route for RPC + broadcast.
  egress:
    driver: bridge
