<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Apps using fwd for signing</title>
  <desc id="desc">Simplified envisaged architecture: caller apps use fwd for policy-gated signing, then broadcast through their own RPC path and report outcomes to fwd.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .appGroup { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; stroke-dasharray: 8 7; rx: 14; }
      .app { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; rx: 14; }
      .fwd { fill: #fee2e2; stroke: #b91c1c; stroke-width: 4; rx: 16; }
      .chain { fill: #d1fae5; stroke: #047857; stroke-width: 3; rx: 14; }
      .safeBox { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; rx: 12; }
      .request { fill: none; stroke: #2563eb; stroke-width: 3.7; marker-end: url(#arrowBlue); }
      .response { fill: none; stroke: #334155; stroke-width: 3.7; marker-end: url(#arrowSlate); }
      .broadcast { fill: none; stroke: #047857; stroke-width: 3.7; marker-end: url(#arrowGreen); }
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .actor { font: 800 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .actorSmall { font: 800 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .role { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .label { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .small { font: 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .feature { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1e3a8a; }
      .safeTitle { font: 800 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #065f46; }
      .safeText { font: 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #064e3b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="700"/>
  <rect class="panel" x="44" y="48" width="1032" height="600"/>

  <text class="title" x="80" y="98">Envisaged fwd caller architecture</text>
  <text class="subtitle" x="80" y="124">Apps keep their own RPC/broadcast path. fwd is the shared policy-gated signer.</text>

  <rect class="appGroup" x="84" y="166" width="306" height="264"/>
  <text class="label" x="112" y="196">caller apps</text>

  <rect class="app" x="118" y="214" width="238" height="112"/>
  <text class="actor" x="237" y="254" text-anchor="middle">clif</text>
  <text class="feature" x="150" y="284">- fsp signing</text>
  <text class="feature" x="150" y="306">- reward claiming</text>

  <rect class="app" x="118" y="340" width="238" height="86"/>
  <text class="actorSmall" x="237" y="376" text-anchor="middle">FSP</text>
  <text class="feature" x="150" y="400">- system client</text>
  <text class="feature" x="150" y="420">- fast updates</text>

  <rect class="chain" x="118" y="526" width="238" height="74"/>
  <text class="actor" x="237" y="572" text-anchor="middle">RPC / chain</text>

  <rect class="fwd" x="610" y="228" width="250" height="142"/>
  <text class="actor" x="697" y="284">fwd</text>
  <text class="role" x="661" y="313">policy-gated signer</text>
  <text class="small" x="674" y="336">no RPC / no broadcast</text>

  <path class="request" d="M 390 270 C 470 238 530 238 610 270"/>
  <text class="label" x="463" y="238">sign request</text>

  <path class="response" d="M 610 315 C 530 315 470 315 390 315"/>
  <text class="label" x="460" y="304">signed payload</text>

  <path class="broadcast" d="M 238 430 L 238 526"/>
  <text class="label" x="256" y="482">broadcast + read chain</text>

  <path class="request" d="M 356 536 C 506 496 646 450 735 370"/>
  <text class="label" x="500" y="470">result report to fwd</text>

  <rect class="safeBox" x="490" y="538" width="460" height="78"/>
  <text class="safeTitle" x="514" y="562">Safety added by fwd</text>
  <text class="safeText" x="514" y="584">No app tx private keys · policy allowlists and caps</text>
  <text class="safeText" x="514" y="604">Audited decisions · no egress signer</text>
</svg>
