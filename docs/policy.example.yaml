# fwd policy.yaml — EXAMPLE (NOT loaded; documentation only).
#
# This is the DEFAULT REWARD POLICY: the exact shape
#   clifwd policy init --networks songbird --recipient 0xYOURADDR --capabilities claim,fsp
# generates — covering the two revenue operations, claiming FTSO rewards
# (RewardManager.claim) and signing FSP rewards (signUptimeVote / signRewards).
# DON'T hand-write this: run `clifwd policy init` (it derives the method
# signatures from the shipped ABIs and fills the chains/carve-out for you), then
# `clifwd policy validate`. For flare/coston2 the addresses + chain id differ
# (this example is songbird = chain 19, the default onboarding network — AP's
# canary). FSP signing requires your key to be a registered voter on the chosen
# network; coston2 is a testnet (register there first if you rehearse on it).
#
# The real policy.yaml is operator-controlled and gitignored (Core invariant #12:
# public repo, private config). Copy to $FWD_POLICY_PATH (default
# /etc/fwd/policy.yaml). Schema is strict (extra keys rejected). version MUST be 1.
#
# Evaluation (D14 + D22, default-deny — only the final step returns Allow):
#   1 caller -> binding (by NAME; caller.policy_path must match binding;
#               binding.policy_path must resolve to a permissions block)
#   2 request.to -> permissions.<path>.contracts.<addr>  (addr case-insensitive)
#     AND request.chain in contracts.<addr>.chains  (a contract address is not
#     chain-unique; chain mismatch -> deny)
#   3 decode request.data against contracts.<addr>.abi   (decode fail -> deny)
#   4 decoded method signature must be in contracts.<addr>.methods
#   4b method with non-scalar (array/tuple) top-level args (decoded but
#     unconstrainable by predicates, B1) -> deny UNLESS the method rule sets
#     allow_unconstrained_args: true
#   5 request.value_wei <= methods.<sig>.max_value_wei   (BigInt)
#   6 arg_predicates: "any" passes; else coerced-compare to the decoded
#     scalar arg (bool-before-int; int via int(str(v)); address
#     case-insensitive; plain string exact)
#   7 request.wallet in permissions.<path>.wallet_allowlist
#   8 caller rate bucket (per_hour / per_day) increment-and-test
#   9 wallet MUST have a policy.wallets binding (else deny); then
#     wallet_constraints: aggregate-value cap + wallet rate
#  10 Allow.
#
# Startup fail-fast (infra/policy_loader.check_consistency): every ACTIVE caller
# must be declared here by NAME with a matching policy_path; every contract abi
# must be a registered ABI (config/abis/registry.yaml); every method signature
# must exist in that ABI; every wallet_allowlist entry must resolve AND have a
# policy.wallets binding; every wallets.<name>.policy_path must be a
# wallet_constraints key. Every contract rule MUST declare chains.

version: 1

# Caller bearer-token identities (the `name` is the caller's name in the callers
# table; policy_path indirects to a permissions / fsp_permissions block).
# Three callers — one per leg (fwd forbids one policy_path in both permissions
# and fsp_permissions, so Leg-1 sign and Leg-2 submit use distinct callers):
callers:
  # `capability_id` (optional, ADR-0001 §3) is the <consumer>/<network>/<role>
  # join key. `clifwd capability grant` / `fwd onboard` attach it when minting;
  # `policy init` does NOT emit it (add it here when binding a capability grant).
  # It must be unique across callers (enforced by `clifwd policy validate`).
  claim-songbird:        # FTSO reward claimer
    policy_path: perm/claim-songbird
    capability_id: clif/songbird/claim
  fsp-sign-songbird:     # FSP Leg-1 — POST /v1/sign-fsp-message
    policy_path: fsp/songbird
    capability_id: clif/songbird/fsp-sign
  fsp-submit-songbird:   # FSP Leg-2 — POST /v1/sign-transaction (FlareSystemsManager)
    policy_path: perm/fsp-submit-songbird
    capability_id: clif/songbird/fsp-submit

# Wallet -> wallet_constraints indirection (per-wallet aggregate/rate cap).
wallets:
  claimer-songbird:      # claim executor — fwd generates+seals (clifwd wallets create)
    policy_path: wc/claimer-songbird
  fsp-signing-songbird:  # the REGISTERED signing-policy key — IMPORT it (clifwd wallets import)
    policy_path: wc/fsp-songbird
  fsp-sender-songbird:   # pays gas for the Leg-2 submit — fwd generates+seals; per-network (default)
    policy_path: wc/fsp-sender-songbird

permissions:
  # --- Claim rewards: RewardManager.claim ---
  perm/claim-songbird:
    contracts:
      "0xE26AD68b17224951b5740F33926Cc438764eB9a7":   # Songbird RewardManager (case-insensitive match)
        abi: reward_manager
        chains: [19]                                   # 14 Flare · 19 Songbird · 114 Coston2
        methods:
          # The proofs arg is a tuple[] (non-scalar, B1) → not predicatable, so
          # allow_unconstrained_args is required; bound by max_value_wei + rate +
          # the pinned recipient instead.
          "claim(address,address,uint24,bool,(bytes32[],(uint24,bytes20,uint120,uint8))[])":
            max_value_wei: "0"
            allow_unconstrained_args: true
            arg_predicates:
              _recipient: "0xYOUR_CLAIM_RECIPIENT_ADDRESS"   # pin YOUR reward destination
    wallet_allowlist: [claimer-songbird]
    rate: { per_hour: 4, per_day: 8 }

  # --- Sign FSP rewards (Leg-2 submit): FlareSystemsManager ---
  perm/fsp-submit-songbird:
    contracts:
      "0x421c69E22f48e14Fc2d2Ee3812c59bfb81c38516":   # Songbird FlareSystemsManager
        abi: flare_systems_manager
        chains: [19]
        methods:
          # Both carry tuple/array args → allow_unconstrained_args required.
          "signUptimeVote(uint24,bytes32,(uint8,bytes32,bytes32))":
            max_value_wei: "0"
            allow_unconstrained_args: true
            arg_predicates: { _rewardEpochId: any }
          "signRewards(uint24,(uint256,uint256)[],bytes32,(uint8,bytes32,bytes32))":
            max_value_wei: "0"
            allow_unconstrained_args: true
            arg_predicates: { _rewardEpochId: any }
    # The signing key self-submits (the carve-out below) + the dedicated
    # sole-submitter sender pays gas. Both must be allowlisted here.
    wallet_allowlist: [fsp-signing-songbird, fsp-sender-songbird]
    rate: { per_hour: 50, per_day: 500 }

wallet_constraints:
  wc/claimer-songbird: { max_aggregate_value_wei_per_day: "0", rate: { per_hour: 4, per_day: 8 } }
  wc/fsp-songbird:     { max_aggregate_value_wei_per_day: "0", rate: { per_hour: 50, per_day: 500 } }
  wc/fsp-sender-songbird: { max_aggregate_value_wei_per_day: "0", rate: { per_hour: 50, per_day: 500 } }

# FSP Leg-1: EIP-191 message signing (POST /v1/sign-fsp-message). No contract —
# just the permitted message types + the signing wallet + rate.
fsp_permissions:
  fsp/songbird:
    message_types: [UPTIME, REWARD_DISTRIBUTION]
    wallet_allowlist: [fsp-signing-songbird]
    rate: { per_hour: 50, per_day: 500 }

# The signing-policy key signs FSP messages (Leg-1) AND appears as a self-submit
# EVM signer (Leg-2) — the narrow carve-out to key-domain segmentation, honoured
# only for the FSM signUptimeVote/signRewards max_value_wei=0 shape above.
fsp_self_submit:
  - fsp-signing-songbird
