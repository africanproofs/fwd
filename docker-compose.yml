services:
  fwd:
    image: registry.gitlab.com/proofs.africa/fwd/fwd:${FWD_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    # Default `fwd` (one stack per host — Core invariant #9). Overridable via
    # FWD_CONTAINER so an isolated second instance can run for local testing
    # without colliding with a production `fwd` container on the same host.
    container_name: ${FWD_CONTAINER:-fwd}
    cap_add:
      # Per Core invariant #1 + #16: fwd's process memory must be lockable
      # against swap so plaintext privkeys (briefly held during signing) are
      # not paged to disk. fwd's mlockall() at startup requires either
      # CAP_IPC_LOCK in the effective capability set OR a sufficient
      # RLIMIT_MEMLOCK. Limits documented honestly in CLAUDE.md Core invariant #1.
      - IPC_LOCK
    # The container runs as non-root user `fwd` (uid 1000) per Dockerfile
    # `USER fwd` — capabilities granted via cap_add land in the bounding set
    # but NOT in the effective set for non-root processes. The mlockall call
    # therefore relies on RLIMIT_MEMLOCK = unlimited rather than CAP_IPC_LOCK.
    # cap_add is kept for defense-in-depth (a future root entrypoint could
    # use it; ambient-capabilities scenarios benefit).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    env_file:
      - .env
    environment:
      # Phase 7 (D14/D16): explicit so the substrate is host-agnostic
      # (Core invariant #10) and the lifespan policy-load is unambiguous.
      # Defaults in src/fwd/settings.py match these; set here for clarity.
      FWD_POLICY_PATH: /etc/fwd/policy.yaml
      FWD_ABIS_DIR: /app/config/abis
    # NO host port. The `fwd-callers` network is `internal: true` (see below),
    # which removes the network's gateway — and with it host→container port
    # publishing: a `ports:` mapping is silently ineffective (`docker port fwd`
    # is empty; host curl → connection refused). Consequences + access pattern:
    #   • CLIENTS (clif, …) reach fwd intra-network at `http://fwd:8080` — they
    #     attach to `fwd-callers` (and a normal bridge of their own for egress).
    #   • ADMIN ops run INSIDE the container: the CLI ones via
    #     `docker exec fwd clifwd <cmd>` (`nonce init`, `callers …`, `wallets …`,
    #     `audit …`); nonce-sync and nonce/holes are HTTP-only admin endpoints
    #     (`POST/GET /v1/admin/nonce/*`) reachable the same way. FWD_ADMIN_KEY is
    #     in the container env via env_file.
    #   • If host-port access is ever required, use an override compose that drops
    #     `internal: true` AND blocks the container's egress at the host firewall
    #     — do not silently re-add a `ports:` line under internal:true.
    volumes:
      - fwd-state:/data
      # Phase 7: operator-controlled policy.yaml (Core invariant #12 —
      # gitignored, never in the image/repo). The ABI registry ships in
      # the image via Dockerfile `COPY config/abis/`; only policy.yaml
      # (and the sealed master, below) mounts.
      - ./config/policy.yaml:/etc/fwd/policy.yaml:ro
      # Sealed master (0600 on host; gitignored like policy.yaml —
      # Core invariant #12). Generate with
      # `clifwd master generate --out ./config/master.key`.
      - ./config/master.key:/run/fwd/master.key:ro
    networks:
      - fwd-callers
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.3.13
    container_name: ${FWD_CONTAINER:-fwd}-litestream
    depends_on:
      - fwd
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      # Litestream needs write access to the source DB to create the
      # `_litestream_seq` and `_litestream_lock` tracking tables used for
      # WAL-replication coherence. A read-only mount surfaces as
      # `attempt to write a readonly database` on every sync iteration
      # and no replica artifacts ever appear in /backup. See
      # https://litestream.io/reference/config/#database — the source DB
      # MUST be writable by the replicator process.
      - fwd-state:/data
      - ./config/litestream/litestream.yml:/etc/litestream.yml:ro
      - backup:/backup
    # Zero network: Litestream writes the replica to the local `backup` Docker
    # volume (Litestream `type: file`) and reads the source DB over the shared
    # `fwd-state` volume — it needs NO network (no internal traffic, no external
    # egress). `network_mode: none` ENFORCES that, keeping the whole stack
    # egress-free.
    # (`network_mode` and `networks:` are mutually exclusive; litestream declares
    # no `networks:`, so this is consistent. `depends_on: fwd` is startup
    # ordering only — unaffected; replication is via the shared volume, not network.)
    network_mode: none
    restart: unless-stopped

networks:
  # fwd attaches to THIS network only. `internal: true` gives the network no
  # gateway to the host's external network → the fwd container has NO route to
  # the internet: a container on an `internal: true` bridge cannot resolve/connect
  # to `flare-api.flare.network:443` (gaierror / no route), while the same image on
  # a normal bridge connects — so fwd, attached only here, cannot reach the
  # internet. This is the network-level enforcement of the zero-egress architecture
  # (a code-level grep shows no RPC/httpx in the daemon): fwd signs and never
  # broadcasts, so it needs no egress. `internal: true` ALSO removes host→container
  # port publishing — there is NO
  # host port; admin runs via `docker exec fwd clifwd …` (see the fwd service's
  # no-host-port comment above).
  #
  # CLIENTS (clif, etc.) are DUAL-HOMED: they attach to `fwd-callers` to reach
  # `fwd:8080`, AND to a normal (non-internal) bridge of their own for their
  # internet/RPC egress (they broadcast the signed tx fwd returns). A client's
  # own compose declares both networks; fwd's compose declares only this one.
  fwd-callers:
    driver: bridge
    internal: true

volumes:
  fwd-state:
  backup:
    # Shared backup target for Litestream (/backup/state.db…).
    # Off-host transport is the operator's responsibility (rsync / restic /
    # borg / NAS / USB — out of band, against this volume). fwd does not
    # transport backups off-host.
    # The volume is created as a Docker-managed named volume by default; for
    # production deployments operators are encouraged to bind-mount a
    # host-path here via an override compose file.
