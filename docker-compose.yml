services:
  vault:
    image: hashicorp/vault:1.18.2
    container_name: fwd-vault
    cap_add:
      - IPC_LOCK
    # The official vault image drops to the vault user (uid=100) via su-exec.
    # Docker named volumes are created root-owned, so we chown /vault/data first.
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R vault:vault /vault/data && exec /usr/local/bin/docker-entrypoint.sh server"]
    environment:
      # The vault CLI defaults to https://127.0.0.1:8200 when VAULT_ADDR is unset.
      # Our listener is HTTP (config.hcl tls_disable=true; fwd-internal is the
      # security boundary). Without this, every `docker exec fwd-vault vault <cmd>`
      # fails with "http: server gave HTTP response to HTTPS client". Setting it
      # in container env makes vault-init.sh and the runbook commands work as-is.
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - vault-data:/vault/data
      - ./config/vault/:/vault/config/:ro
      - ./scripts/:/vault/scripts/:ro
    networks:
      - fwd-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status -format=json || true"]
      interval: 10s
      timeout: 3s
      retries: 5

  fwd:
    image: registry.gitlab.com/proofs.africa/fwd/fwd:${FWD_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fwd
    cap_add:
      # Per Core invariant #1 + #16: fwd's process memory must be lockable
      # against swap so plaintext privkeys (briefly held during signing) are
      # not paged to disk. fwd's mlockall() at startup requires either
      # CAP_IPC_LOCK in the effective capability set OR a sufficient
      # RLIMIT_MEMLOCK. Limits documented honestly in CLAUDE.md Core invariant #1.
      - IPC_LOCK
    # The container runs as non-root user `fwd` (uid 1000) per Dockerfile
    # `USER fwd` — capabilities granted via cap_add land in the bounding set
    # but NOT in the effective set for non-root processes. The mlockall call
    # therefore relies on RLIMIT_MEMLOCK = unlimited rather than CAP_IPC_LOCK.
    # cap_add is kept for defense-in-depth (a future root entrypoint could
    # use it; ambient-capabilities scenarios benefit).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    depends_on:
      vault:
        condition: service_started
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - fwd-state:/data
    networks:
      - fwd-internal
      - fwd-callers
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.3.13
    container_name: fwd-litestream
    depends_on:
      - fwd
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      # Litestream needs write access to the source DB to create the
      # `_litestream_seq` and `_litestream_lock` tracking tables used for
      # WAL-replication coherence. A read-only mount surfaces as
      # `attempt to write a readonly database` on every sync iteration
      # and no replica artifacts ever appear in /backup. See
      # https://litestream.io/reference/config/#database — the source DB
      # MUST be writable by the replicator process.
      - fwd-state:/data
      - ./config/litestream/litestream.yml:/etc/litestream.yml:ro
      - backup:/backup
    # No network membership: Litestream now writes the replica to the local
    # `backup` Docker volume (Litestream type: file). It needs no network
    # access — no internal Vault traffic, no public S3 egress.
    restart: unless-stopped

  vault-snapshot:
    build:
      context: .
      dockerfile: config/vault-snapshot/Dockerfile
    container_name: fwd-vault-snapshot
    depends_on:
      vault:
        condition: service_started
    env_file:
      - .env
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - backup:/backup
    networks:
      - fwd-internal
    restart: unless-stopped

networks:
  fwd-internal:
    internal: true
  fwd-callers:
    driver: bridge

volumes:
  vault-data:
  fwd-state:
  backup:
    # Shared backup target for Litestream (/backup/state.db…) and
    # vault-snapshot (/backup/vault-snapshots/…). Off-host transport is the
    # operator's responsibility (rsync / restic / borg / NAS / USB — out of
    # band, against this volume). fwd does not transport backups off-host.
    # The volume is created as a Docker-managed named volume by default; for
    # production deployments operators are encouraged to bind-mount a
    # host-path here via an override compose file.
