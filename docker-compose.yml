services:
  fwd:
    image: registry.gitlab.com/proofs.africa/fwd/fwd:${FWD_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fwd
    cap_add:
      # Per Core invariant #1 + #16: fwd's process memory must be lockable
      # against swap so plaintext privkeys (briefly held during signing) are
      # not paged to disk. fwd's mlockall() at startup requires either
      # CAP_IPC_LOCK in the effective capability set OR a sufficient
      # RLIMIT_MEMLOCK. Limits documented honestly in CLAUDE.md Core invariant #1.
      - IPC_LOCK
    # The container runs as non-root user `fwd` (uid 1000) per Dockerfile
    # `USER fwd` — capabilities granted via cap_add land in the bounding set
    # but NOT in the effective set for non-root processes. The mlockall call
    # therefore relies on RLIMIT_MEMLOCK = unlimited rather than CAP_IPC_LOCK.
    # cap_add is kept for defense-in-depth (a future root entrypoint could
    # use it; ambient-capabilities scenarios benefit).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    env_file:
      - .env
    environment:
      # Phase 7 (D14/D16): explicit so the substrate is host-agnostic
      # (Core invariant #10) and the lifespan policy-load is unambiguous.
      # Defaults in src/fwd/settings.py match these; set here for clarity.
      FWD_POLICY_PATH: /etc/fwd/policy.yaml
      FWD_ABIS_DIR: /app/config/abis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - fwd-state:/data
      # Phase 7: operator-controlled policy.yaml (Core invariant #12 —
      # gitignored, never in the image/repo). The ABI registry ships in
      # the image via Dockerfile `COPY config/`; only policy.yaml mounts.
      - ./config/policy.yaml:/etc/fwd/policy.yaml:ro
      # v1.0.0a1 sealed master (0600 on host; gitignored like policy.yaml —
      # Core invariant #12). Generate with
      # `clifwd master generate --out ./config/master.key`.
      - ./config/master.key:/run/fwd/master.key:ro
    networks:
      - fwd-callers
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.3.13
    container_name: fwd-litestream
    depends_on:
      - fwd
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      # Litestream needs write access to the source DB to create the
      # `_litestream_seq` and `_litestream_lock` tracking tables used for
      # WAL-replication coherence. A read-only mount surfaces as
      # `attempt to write a readonly database` on every sync iteration
      # and no replica artifacts ever appear in /backup. See
      # https://litestream.io/reference/config/#database — the source DB
      # MUST be writable by the replicator process.
      - fwd-state:/data
      - ./config/litestream/litestream.yml:/etc/litestream.yml:ro
      - backup:/backup
    # No network membership: Litestream now writes the replica to the local
    # `backup` Docker volume (Litestream type: file). It needs no network
    # access — no internal Vault traffic, no public S3 egress.
    restart: unless-stopped

networks:
  # fwd attaches to THIS network only. `internal: true` gives the network no
  # gateway to the host's external network → the fwd container has NO route to
  # the internet. Verified (v1.1.0a11): a container on an `internal: true` bridge
  # cannot resolve/connect to `flare-api.flare.network:443` (gaierror / no route),
  # while the same image on a normal bridge connects — so fwd, attached only here,
  # cannot reach the internet. This is the network-level enforcement of the
  # v1.1.0a9 zero-egress architecture (a code-level grep already shows no RPC/httpx
  # in the daemon): fwd
  # signs and never broadcasts, so it needs no egress. Published ports
  # (127.0.0.1:8080) still work — DNAT to a published port is independent of the
  # container's (absent) egress route.
  #
  # CLIENTS (clif, etc.) are DUAL-HOMED: they attach to `fwd-callers` to reach
  # `fwd:8080`, AND to a normal (non-internal) bridge of their own for their
  # internet/RPC egress (they broadcast the signed tx fwd returns). A client's
  # own compose declares both networks; fwd's compose declares only this one.
  fwd-callers:
    driver: bridge
    internal: true

volumes:
  fwd-state:
  backup:
    # Shared backup target for Litestream (/backup/state.db…).
    # Off-host transport is the operator's responsibility (rsync / restic /
    # borg / NAS / USB — out of band, against this volume). fwd does not
    # transport backups off-host.
    # The volume is created as a Docker-managed named volume by default; for
    # production deployments operators are encouraged to bind-mount a
    # host-path here via an override compose file.
